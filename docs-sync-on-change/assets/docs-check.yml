# Fails a pull request when generated docs are out of date.
# Copy to .github/workflows/docs-check.yml and replace the generator command.
name: Docs in sync

on: [pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate docs
        run: ./scripts/build-docs.sh # replace with your generator
      - name: Fail if anything changed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Docs are out of sync. Run the generator and commit the result."
            exit 1
          fi
